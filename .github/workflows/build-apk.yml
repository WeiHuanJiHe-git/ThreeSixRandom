name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Core rule test
        shell: bash
        run: |
          mkdir -p build/core-test
          javac -d build/core-test \
            app/src/main/java/com/fonuhuo/sevenrandom/RandomEngine.java \
            app/src/main/java/com/fonuhuo/sevenrandom/DivinationEngine.java \
            app/src/main/java/com/fonuhuo/sevenrandom/RandomEngineTest.java
          java -cp build/core-test com.fonuhuo.sevenrandom.RandomEngineTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ThreeSixRandom-v1.5.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThreeSixRandom-v1.5.0-apk
          path: ThreeSixRandom-v1.5.0.apk
