name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Core rule test
        run: |
          mkdir -p build/core-test
          javac -d build/core-test \
            app/src/main/java/com/fonuhuo/sevenrandom/RandomEngine.java \
            app/src/main/java/com/fonuhuo/sevenrandom/DivinationEngine.java \
            app/src/main/java/com/fonuhuo/sevenrandom/RandomEngineTest.java
          java -cp build/core-test com.fonuhuo.sevenrandom.RandomEngineTest

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ThreeSixRandom-v1.5.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ThreeSixRandom-v1.5.0-apk
          path: ThreeSixRandom-v1.5.0.apk
